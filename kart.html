const ALT='#7c3aed';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en');
const sgn=(n,u)=>(n>0?'+':n<0?'−':'±')+fmt(Math.abs(n))+(u?' '+u:'');
const map=L.map('map');
const kv=n=>L.tileLayer(`https://cache.kartverket.no/v1/wmts/1.0.0/${n}/default/webmercator/{z}/{y}/{x}.png`,{maxZoom:18,attribution:'© Kartverket'});
const base={'Topographic':kv('topo'),'Grey':kv('topograatone'),'Light':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'})};
base['Topographic'].addTo(map);L.control.layers(base,null,{position:'topright'}).addTo(map);
const list=document.getElementById('list'),vlist=document.getElementById('vlist');
const all=L.featureGroup().addTo(map),ghost=L.featureGroup().addTo(map);
const pins={r:L.layerGroup().addTo(map),d:L.layerGroup().addTo(map),h:L.layerGroup().addTo(map)},tid={r:'tR',d:'tD',h:'tH'};
const active=new Set();let gravel=false;
try{const h=location.hash;(h.match(/v=([\w,]+)/)||[,''])[1].split(',').forEach(id=>{if(id==='gravel')gravel=true;else if(D.variants.some(v=>v.id===id))active.add(id)});if(/[#&]g=1/.test(h))gravel=true}catch(e){}
const partOf=n=>D.parts.find(p=>n>=p[0]&&n<=p[1]);
const overlaps=(a,b)=>a.first<=b.last&&b.first<=a.last;
const eff=(s,g)=>g&&s.g?Object.assign({},s,s.g,{gm:1}):s;
function sequence(act=active,g=gravel){const out=[];let i=1;const B=D.gblock;
  const blockOK=g&&!D.variants.some(v=>act.has(v.id)&&v.first<=B.last&&B.first<=v.last);
  while(i<=D.main.length){const v=D.variants.find(v=>act.has(v.id)&&v.first===i);
    if(v){v.stages.forEach(s=>out.push({s:eff(s,g),alt:v,part:partOf(v.first)}));i=v.last+1}
    else if(blockOK&&i===B.first){B.stages.forEach(s=>out.push({s:Object.assign({gm:1},s),alt:null,part:partOf(i)}));i=B.last+1}
    else{out.push({s:eff(D.main[i-1],g),alt:null,part:partOf(i)});i++}}
  return out}
const tot=q=>({n:q.length,km:q.reduce((a,x)=>a+x.s.km,0),asc:q.reduce((a,x)=>a+x.s.asc,0),unp:q.reduce((a,x)=>a+x.s.unp,0)});
const days=n=>`${sgn(n)} day${Math.abs(n)===1?'':'s'}`;
function pin(k,ll,title,popup){const mk=L.marker(ll,{icon:L.divIcon({className:'pin '+k,html:'<i></i>',iconSize:[15,15],iconAnchor:[7,7]}),title,riseOnHover:true});mk.bindPopup(popup,{maxWidth:260});mk.addTo(pins[k]);return mk}
function showPin(k,ll,mk){if(!map.hasLayer(pins[k]))document.getElementById(tid[k]).click();map.setView(ll,Math.max(map.getZoom(),11));mk.openPopup()}
let open=null;
function render(){
  all.clearLayers();ghost.clearLayers();Object.values(pins).forEach(p=>p.clearLayers());list.innerHTML='';open=null;
  const seq=sequence();let lastPart=null;
  seq.forEach((it,idx)=>{const s=it.s,n=idx+1,color=it.alt?ALT:it.part[3];
    const g=L.featureGroup();
    s.segs.forEach(x=>{if(x.g){L.polyline(x.c,{color:'#1f2937',weight:7,opacity:.95,lineCap:'butt'}).addTo(g);L.polyline(x.c,{color:'#fbbf24',weight:4,dashArray:'7 5',lineCap:'butt'}).addTo(g)}
      else L.polyline(x.c,x.f?{color:'#475569',weight:2,dashArray:'5 6'}:{color,weight:4,opacity:.9}).addTo(g)});
    L.circleMarker(s.segs[0].c[0],{radius:3.5,color:'#fff',weight:1.5,fillColor:color,fillOpacity:1,interactive:false}).addTo(g);
    g.bindTooltip(`${n}. ${s.name} · ${s.km} km · +${s.asc} m${s.unp?` · ${s.unp} km gravel`:''}`,{sticky:true});g.addTo(all);
    if(it.part!==lastPart){lastPart=it.part;const h=document.createElement('div');h.className='part';h.style.background=it.part[3];h.textContent=it.part[2];list.appendChild(h)}
    const nd=s.lm.filter(l=>l.k==='d').length,nr=s.lm.length-nd;
    const btn=document.createElement('button');btn.className='st'+(it.alt?' alt':'')+(s.gm?' gm':'');btn.type='button';btn.setAttribute('aria-expanded','false');
    btn.innerHTML=`<b>${n}</b><span class="nm">${esc(s.name)}<span class="cnt">${nr} landmark${nr===1?'':'s'}${nd?` · ${nd} detour${nd===1?'':'s'}`:''}${s.huts.length?` · ${s.huts.length} cabin${s.huts.length===1?'':'s'}`:''}${s.unp?` · ${s.unp} km gravel`:''}</span></span><span class="num">${s.km} km<br>+${s.asc} m</span><span class="chev"></span>`;
    const panel=document.createElement('div');panel.className='panel';panel.hidden=true;
    const label=`<span class="s">Stage ${n} · ${esc(s.name)}</span>`;
    s.lm.forEach(l=>{
      const mk=pin(l.k,l.ll,l.n,`<b>${esc(l.n)}</b><br>${l.k==='d'?`<span class="x">Detour${l.x?' · '+esc(l.x):''}</span><br>`:''}${esc(l.t)}<br>${label}`);
      const row=document.createElement('button');row.type='button';row.className='lm';
      row.innerHTML=`<span class="mk ${l.k}"></span><span><span class="t">${esc(l.n)}</span><span class="d">${esc(l.t)}</span>${l.k==='d'?`<span class="x">Detour${l.x?' · '+esc(l.x):''}</span>`:''}</span>`;
      row.onclick=()=>showPin(l.k,l.ll,mk);panel.appendChild(row)});
    if(s.huts.length){const h=document.createElement('div');h.className='grp';h.textContent='Backup cabins';panel.appendChild(h)}
    s.huts.forEach(u=>{
      const where=u.d<=1?'By the route':`About ${u.d} km off the route, likely on foot`;
      const facts=[u.e?u.e+' m':'',u.cap?u.cap+' beds':'',u.lock?'DNT key':''].filter(Boolean).join(' · ');
      const mk=pin('h',u.ll,u.n,`<b>${esc(u.n)}</b><br><span class="x h">${esc(u.c)}</span><br>${where}${facts?'<br>'+esc(facts):''}${u.op?'<br>'+esc(u.op):''}${u.w?`<br><a href="${esc(u.w)}" target="_blank" rel="noopener noreferrer">Cabin page</a>`:''}<br>${label}`);
      const row=document.createElement('button');row.type='button';row.className='lm';
      row.innerHTML=`<span class="mk h"></span><span><span class="t">${esc(u.n)}</span><span class="d">${esc(u.c)}${facts?' · '+esc(facts):''}</span><span class="x h">${where}</span></span>`;
      row.onclick=()=>showPin('h',u.ll,mk);panel.appendChild(row)});
    const bounds=()=>{const b=g.getBounds();s.lm.forEach(l=>b.extend(l.ll));s.huts.forEach(l=>b.extend(l.ll));return b};
    const toggle=show=>{btn.setAttribute('aria-expanded',show);panel.hidden=!show};
    btn.onclick=()=>{const was=btn.getAttribute('aria-expanded')==='true';
      if(open&&open!==toggle)open(false);toggle(!was);open=was?null:toggle;map.closePopup();
      map.fitBounds(was?all.getBounds():bounds(),{padding:[30,30]})};
    g.on('click',()=>{if(btn.getAttribute('aria-expanded')!=='true')btn.click();btn.scrollIntoView({block:'start',behavior:'smooth'})});
    list.appendChild(btn);list.appendChild(panel)});
  // alternatives that are switched off: faint dashed line, click to switch on
  const base=tot(sequence(new Set(),gravel));D.variants.forEach(v=>{const t=tot(sequence(new Set([v.id]),gravel));v._d={km:t.km-base.km,asc:t.asc-base.asc,unp:t.unp-base.unp,n:t.n-base.n};
    const repl=v.first===v.last?`stage ${v.first}`:`stages ${v.first}–${v.last}`;
    document.querySelector(`.vb[data-id=${v.id}] .vd`).textContent=`${sgn(v._d.km,'km')} · ${sgn(v._d.asc,'m')} · ${days(v._d.n)}${gravel?` · ${sgn(v._d.unp,'km')} gravel`:''} · replaces ${repl}`});
  {const a=tot(sequence(active,true)),b=tot(sequence(active,false));document.querySelector('#gmode .vd').textContent=`${sgn(a.unp-b.unp,'km')} gravel · ${sgn(a.km-b.km,'km')} · ${sgn(a.asc-b.asc,'m')} · ${days(a.n-b.n)}`}
  D.variants.filter(v=>!active.has(v.id)).forEach(v=>{const g=L.featureGroup();
    v.stages.forEach(s=>eff(s,gravel).segs.forEach(x=>{if(!x.f)L.polyline(x.c,{color:ALT,weight:3,opacity:.55,dashArray:'2 7'}).addTo(g)}));
    g.bindTooltip(`Alternative: ${v.title} (${sgn(v._d.km,'km')}, ${days(v._d.n)}). Click to switch on.`,{sticky:true});
    g.on('click',()=>setVariant(v.id,true));g.addTo(ghost)});
  const km=seq.reduce((a,x)=>a+x.s.km,0),asc=seq.reduce((a,x)=>a+x.s.asc,0);
  document.getElementById('sum').textContent=`${seq.length} stages · ${fmt(km)} km · ${fmt(asc)} m climbing · ${seq.reduce((a,x)=>a+x.s.lm.length,0)} landmarks and detours · ${seq.reduce((a,x)=>a+x.s.huts.length,0)} backup cabins · ${fmt(seq.reduce((a,x)=>a+x.s.unp,0))} km gravel. Click a day to open it.`;
  document.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id==='gravel'?gravel:active.has(b.dataset.id)));
  try{const h=[active.size?'v='+[...active].join(','):'',gravel?'g=1':''].filter(Boolean).join('&');history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}
}
function setVariant(id,on){const v=D.variants.find(v=>v.id===id);
  if(on){D.variants.forEach(o=>{if(o!==v&&active.has(o.id)&&overlaps(o,v))active.delete(o.id)});active.add(id)}else active.delete(id);
  render();
  const b=L.latLngBounds([]);(on?v.stages:D.main.slice(v.first-1,v.last)).forEach(s=>eff(s,gravel).segs.forEach(x=>b.extend(x.c)));
  map.fitBounds(b,{padding:[40,40]})}
D.variants.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='vb';b.dataset.id=v.id;b.setAttribute('aria-pressed','false');
  const repl=v.first===v.last?`stage ${v.first}`:`stages ${v.first}–${v.last}`;
  b.innerHTML=`<span class="sw"></span><span><span class="vt">${esc(v.title)}</span><span class="vd"></span><span class="vx">${esc(v.blurb)}</span></span>`;
  b.onclick=()=>setVariant(v.id,!active.has(v.id));vlist.appendChild(b)});
{const b=document.createElement('button');b.type='button';b.className='vb';b.dataset.id='gravel';b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="sw"></span><span><span class="vt">Gravel mode</span><span class="vd"></span><span class="vx">Moves the route onto gravel roads wherever that makes sense, including any alternative routes you have switched on.</span></span>`;
  b.onclick=()=>{gravel=!gravel;render()};document.getElementById('gmode').appendChild(b)}
document.getElementById('tR').onchange=e=>e.target.checked?pins.r.addTo(map):pins.r.remove();
document.getElementById('tD').onchange=e=>e.target.checked?pins.d.addTo(map):pins.d.remove();
document.getElementById('tH').onchange=e=>e.target.checked?pins.h.addTo(map):pins.h.remove();
const far=()=>map.getContainer().classList.toggle('far',map.getZoom()<7);map.on('zoomend',far);
render();
const fit=()=>{map.invalidateSize();const b=all.getBounds();ghost.eachLayer(l=>b.extend(l.getBounds()));map.fitBounds(b)};fit();setTimeout(fit,300);window.addEventListener('load',fit);
